# Se rulează O SINGURĂ DATĂ, după ce noul zip a fost dezarhivat: Actions → Curățare structură veche → Run workflow.
name: Curățare structură veche
on: workflow_dispatch
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f js/core/core.js || { echo "Noua structură nu e încă pe site. Oprire."; exit 1; }
          git rm -rq --ignore-unmatch ai functions firebase.json .firebaserc
          for f in admin ai cantina config core demo engine exam firebase galerie home lectii login orar pdf profesori resurse teste theme; do git rm -q --ignore-unmatch "js/$f.js"; done
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -m "Curățare structură veche" || echo "Nimic de șters"
          git push
